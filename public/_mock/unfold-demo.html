<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>HELIX — Unfold on scroll (demo)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800;900&family=Rubik:wght@800;900&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{--pac:#A78BFA;}
  body{font-family:'Heebo',sans-serif;background:#080A0F;color:#EDEEF2;
    background-image:radial-gradient(900px 520px at 50% -6%,color-mix(in srgb,var(--pac) 14%,transparent),transparent 60%);}
  .hero{text-align:center;padding:70px 20px 0;}
  .eyebrow{font-family:'Rubik';font-weight:800;font-size:12px;letter-spacing:.22em;color:var(--pac);text-transform:uppercase;}
  h1{font-family:'Rubik';font-weight:900;font-size:clamp(34px,4.6vw,60px);letter-spacing:-.035em;line-height:1.04;margin:14px 0;}
  h1 em{font-style:normal;color:var(--pac);}
  .sub{color:#7C8194;font-size:17px;max-width:520px;margin:0 auto;line-height:1.6;}
  .scrollhint{margin-top:26px;color:#7C8194;font-size:13px;}
  .unfold{padding:40px 24px 140px;position:relative;}
  .orb{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none;}
  .orb.a{top:-40px;inset-inline-end:12%;width:440px;height:440px;background:radial-gradient(circle,color-mix(in srgb,var(--pac) 26%,transparent),transparent 65%);}
  .orb.b{bottom:80px;inset-inline-start:8%;width:400px;height:400px;background:radial-gradient(circle,rgba(22,255,171,.12),transparent 65%);}
  .persp{perspective:1400px;perspective-origin:50% 0%;max-width:880px;margin:0 auto;position:relative;z-index:1;}
  .frame{position:relative;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.14);background:#101312;
    transform-origin:50% 55%;transform:rotateX(60deg) scale(.92);box-shadow:0 60px 110px rgba(0,0,0,.7);will-change:transform;}
  .fglow{position:absolute;inset:-2px;z-index:2;pointer-events:none;border-radius:16px;
    box-shadow:0 0 0 1px color-mix(in srgb,var(--pac) 30%,transparent) inset,0 0 60px color-mix(in srgb,var(--pac) 22%,transparent);}
  .bar{height:36px;background:linear-gradient(#1b1e26,#14161c);display:flex;align-items:center;gap:7px;padding:0 14px;border-bottom:1px solid rgba(255,255,255,.08);}
  .dot{width:11px;height:11px;border-radius:50%;}
  .url{margin:0 auto;background:#0C0F0E;border:1px solid rgba(255,255,255,.08);border-radius:100px;font-size:11px;color:#7C8194;padding:4px 16px;}
  .url b{color:var(--pac);}
  .frame img{display:block;width:100%;height:auto;}
  .spacer{height:120vh;}
</style></head><body>
  <div class="hero">
    <div class="eyebrow">Marketing Operations Hub</div>
    <h1>כל השיווק.<br><em>מערכת אחת.</em></h1>
    <p class="sub">מהרגע שמישהו מבקש תוכן ועד שהוא עולה לאוויר בכל הערוצים — הכל במקום אחד.</p>
    <div class="scrollhint">↓ גללו — המסך מזדקף מולכם</div>
  </div>
  <div style="height:42vh"></div>
  <div class="unfold" id="unfold">
    <div class="orb a"></div><div class="orb b"></div>
    <div class="persp"><div class="frame" id="frame">
      <div class="fglow"></div>
      <div class="bar"><span class="dot" style="background:#FF5F57"></span><span class="dot" style="background:#FEBC2E"></span><span class="dot" style="background:#28C840"></span><span class="url">🔒 app.helix.co.il/<b>marketing-ops</b></span></div>
      <img src="/_mock/shots/marketing-ops-1.jpg" alt="HELIX OPS"/>
    </div></div>
  </div>
  <div class="spacer"></div>
  <script>
    const sec=document.getElementById('unfold'),frame=document.getElementById('frame');
    const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
    function loop(){
      const r=sec.getBoundingClientRect(),vh=innerHeight;
      let p=clamp((vh*0.9-r.top)/(vh*0.5),0,1);
      p=p*p*(3-2*p); // smoothstep — sharp snap
      const rx=(1-p)*60, sc=0.92+p*0.08;
      frame.style.transform=`rotateX(${rx}deg) scale(${sc})`;
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body></html>
