# Firebase App Hosting config for the HELIX CHIEF CRM (backend: helix-crm,
# project helix-fc9de, region europe-west4, rootDir helix-crm — see the root
# firebase.json). Deploy with:
#   firebase deploy --only apphosting:helix-crm --project helix-fc9de
#
# Same value/secret rules as the website's root apphosting.yaml:
#   value:  — committed literal, only for things already public.
#   secret: — the NAME of a Cloud Secret Manager secret. Missing grant = boot
#             failure. Grant with:
#   firebase apphosting:secrets:grantaccess NAME --project helix-fc9de --backend helix-crm
#
# The CRM shares the HELIX family Supabase project (per PRODUCTS/HELIX-CRM-SPEC:
# "פנימי: אותו Supabase / service token"), so it reuses the SAME Secret Manager
# secrets the website backend uses. Note the name mapping: the CRM code reads
# SUPABASE_SERVICE_ROLE_KEY, the secret is stored as SUPABASE_SERVICE_KEY.
#
# NEVER set STATIC_EXPORT or NODE_ENV here (same reasons as the website config).

runConfig:
  minInstances: 0
  maxInstances: 4
  # /api/chief does multi-second LLM calls (maxDuration 60) and the automations
  # engine sends email batches; keep concurrency moderate on 1 vCPU.
  concurrency: 40
  cpu: 1
  memoryMiB: 1024
  timeoutSeconds: 120

env:
  # ── Build-time: inlined into the client bundle. BUILD availability required. ──
  - variable: NEXT_PUBLIC_SUPABASE_URL
    value: https://agpsyjoxokbaympwnldg.supabase.co
    availability:
      - BUILD
      - RUNTIME

  # Public-by-design anon key, kept in Secret Manager because this repo is
  # public on GitHub (same reasoning as the website backend).
  - variable: NEXT_PUBLIC_SUPABASE_ANON_KEY
    secret: NEXT_PUBLIC_SUPABASE_ANON_KEY
    availability:
      - BUILD
      - RUNTIME

  # OAuth redirects, email links, OG urls. Must match the live origin —
  # https://crm.helix.co.il once the custom domain is attached. Also add
  # https://crm.helix.co.il/auth/callback to Supabase Auth → Redirect URLs.
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://crm.helix.co.il
    availability:
      - BUILD
      - RUNTIME

  # ── Runtime secrets ──
  # service_role — bypasses RLS. Code reads SUPABASE_SERVICE_ROLE_KEY; the
  # secret name in this GCP project is SUPABASE_SERVICE_KEY. Do not "fix" this.
  - variable: SUPABASE_SERVICE_ROLE_KEY
    secret: SUPABASE_SERVICE_KEY
    availability:
      - RUNTIME

  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
    availability:
      - RUNTIME

  # Auth for the cron endpoints /api/digest and /api/email/run-scheduled
  # (Cloud Scheduler sends "Authorization: Bearer <value>"). Both endpoints
  # fail closed with 401 while this is unset/ungranted.
  - variable: DIGEST_SECRET
    secret: DIGEST_SECRET
    availability:
      - RUNTIME

  # CHIEF AI (/api/chief) + the AI automation builder. 503s without it.
  - variable: ANTHROPIC_API_KEY
    secret: ANTHROPIC_API_KEY
    availability:
      - RUNTIME

  # ── Deliberately unset (defaults / later stages) ──
  # RESEND_FROM — defaults in code to 'HELIX STAGE <onboarding@resend.dev>'.
  # Set a real from-address only after verifying helix.co.il in Resend:
  # - variable: RESEND_FROM
  #   value: "HELIX <chief@helix.co.il>"
  #   availability: [RUNTIME]
  #
  # COOKIE_DOMAIN — enables cross-subdomain auth cookies (.helix.co.il).
  # LEAVE COMMENTED until crm.helix.co.il is attached and serving: with it set,
  # login breaks on the temporary *.hosted.app URL (browser rejects the
  # cross-domain cookie). Uncomment + redeploy after the domain is live.
  # - variable: COOKIE_DOMAIN
  #   value: .helix.co.il
  #   availability: [RUNTIME]
  #
  # Optional integrations — each no-ops safely when unset:
  # - variable: CALCOM_API_KEY
  #   secret: CALCOM_API_KEY
  #   availability: [RUNTIME]
  # - variable: CALCOM_EVENT_TYPE_ID
  #   value: "000000"
  #   availability: [RUNTIME]
  # - variable: HELIX_AI_GATEWAY_URL
  #   value: "https://..."
  #   availability: [RUNTIME]
  # - variable: HELIX_GATEWAY_KEY
  #   secret: HELIX_GATEWAY_KEY
  #   availability: [RUNTIME]
  # - variable: N8N_WEBHOOK_URL
  #   value: "https://..."
  #   availability: [RUNTIME]
  # - variable: WHATSAPP_TOKEN
  #   secret: WHATSAPP_TOKEN
  #   availability: [RUNTIME]
