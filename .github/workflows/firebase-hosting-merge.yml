name: master — build gate

# What this used to do: `npm run build:static` and publish the server-less export
# to the Firebase Hosting LIVE channel. That is exactly what made all eight
# /api/* routes 404 in production. The site now runs on Firebase App Hosting
# (backend `helix-website`, europe-west4), which serves the full Next.js server.
#
# Do NOT reintroduce a Hosting deploy here. It would republish the static bundle
# over the live domain and break every form and tool again.
#
# ── Why this workflow no longer deploys ────────────────────────────────────────
# Deploying App Hosting from CI was tried and deliberately abandoned.
# `firebase deploy --only apphosting` does more than upload: it reconciles the
# backend, and ends up calling iam.serviceAccounts.create and then
# cloudresourcemanager setIamPolicy. Granting a CI credential the right to
# rewrite project IAM is effectively granting it ownership — not acceptable for
# a key stored in a PUBLIC repository's Actions secrets. The elevated roles that
# were granted while testing this have been revoked; github-deployer is back to
# firebase.viewer + firebasehosting.admin.
#
# ── How production actually deploys ───────────────────────────────────────────
# Preferred: connect the backend to this GitHub repo once, in the console
#   https://console.firebase.google.com/project/helix-fc9de/apphosting
# App Hosting then rolls out by itself on every push to master, using its own
# service identity. No credential in CI at all, which is why it is preferred.
#
# Until that connection exists, deploy from a trusted machine:
#   firebase deploy --only apphosting --project helix-fc9de
on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    name: Server build (Linux, case-sensitive)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx tsc --noEmit

      # This gate is not ceremony. Development is on macOS, which is
      # case-insensitive: a bare "PRODUCTS" entry in firebase.json's ignore list
      # also matched app/products/, so the uploaded source was missing five
      # modules and Cloud Build failed while the local build was green. A Linux
      # compile catches that class of bug in about a minute.
      - run: npm run build
        env:
          NEXT_PUBLIC_GA_ID: G-NT22TNKPT4
