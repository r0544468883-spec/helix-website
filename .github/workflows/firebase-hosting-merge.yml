name: Firebase Hosting — deploy live

# Runs when commits land on master (i.e. a PR is merged, or a direct push).
# Builds the static export and deploys it to the LIVE channel — this is what
# helix.co.il / www.helix.co.il serves.
on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build:static

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HELIX_FC9DE }}
          projectId: helix-fc9de
          channelId: live
