name: App Hosting — deploy live

# Runs when commits land on master (a PR merge, or a direct push).
#
# This used to run `npm run build:static` and publish the server-less export to
# Firebase Hosting. That is what made all eight /api/* routes 404 in production.
# The site now runs on Firebase App Hosting (backend `helix-website`,
# europe-west4), which serves the full Next.js server including route handlers.
#
# Do NOT reintroduce a Hosting deploy here: it would republish the static bundle
# over the live domain and break every form and tool again.
on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  # Never let two rollouts race; a queued push supersedes an in-flight one.
  group: apphosting-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Build here first, purely as a gate. Cloud Build would catch a broken
      # build anyway, but this fails in ~1 minute instead of ~6 and it runs on
      # Linux — which is the point. macOS is case-insensitive, so imports that
      # differ only in case (and path patterns that collide with them) build
      # fine locally and fail in the cloud. That exact class of bug cost a
      # deploy already.
      - name: Build check (Linux, case-sensitive)
        run: npm run build
        env:
          NEXT_PUBLIC_GA_ID: G-NT22TNKPT4

      # Runtime env and secrets come from apphosting.yaml + Cloud Secret Manager,
      # NOT from this workflow. Nothing secret is needed here beyond the deploy
      # credential itself.
      #
      # The secret holds RAW service-account JSON (the format the old
      # FirebaseExtended/action-hosting-deploy expected). Write it to a file and
      # point GOOGLE_APPLICATION_CREDENTIALS at it, which the Firebase CLI reads
      # directly. Do not switch to an action that wants base64 without also
      # re-encoding the secret — that mismatch fails with "base64: invalid input".
      - name: Deploy to App Hosting
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HELIX_FC9DE }}
        run: |
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@latest deploy --only apphosting --project helix-fc9de
          rm -f "$RUNNER_TEMP/sa.json"
